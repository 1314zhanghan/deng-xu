name: Deploy to GitHub Pages

on:
  # 触发条件：推送到 main 分支时触发
  push:
    branches: ["main"]
  # 允许手动触发工作流
  workflow_dispatch:

# 设置 GITHUB_TOKEN 的权限，允许部署到 GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 允许并发部署，但取消正在进行的部署
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # 构建任务
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # 锁到 10，和本地开发用的大版本一致。
          # 原本写 9，结果 pnpm-workspace.yaml 里一个 10+ 才认的字段
          # 让 CI 在 setup-node 阶段就报 "packages field missing or empty" ——
          # 本地正常、CI 挂掉，很难排查。锁一致版本可以避免这类差异。
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        # 仓库提交的是 pnpm-lock.yaml，用 --frozen-lockfile 保证 CI 与本地一致
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Vite 默认构建输出目录为 dist
          path: ./dist

  # 部署任务
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
