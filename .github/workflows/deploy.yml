name: Deploy to GitHub Pages

on:
  # 触发条件：推送到 main 分支时触发
  push:
    branches: ["main"]
  # 允许手动触发工作流
  workflow_dispatch:

# 设置 GITHUB_TOKEN 的权限，允许部署到 GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 允许并发部署，但取消正在进行的部署
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # 构建任务
  build:
    # 用 windows-latest 而不是 ubuntu-latest：
    # 浏览器走查需要真实浏览器（Edge / Chrome），而 ubuntu runner 上
    # 只有 chromium 的 snap 骨架，跑 headless 布局与真机不一致。
    # Windows runner 预装 Edge，走查脚本的路径探测能直接命中。
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # 锁到 10，和本地开发用的大版本一致。
          # 原本写 9，结果 pnpm-workspace.yaml 里一个 10+ 才认的字段
          # 让 CI 在 setup-node 阶段就报 "packages field missing or empty" ——
          # 本地正常、CI 挂掉，很难排查。锁一致版本可以避免这类差异。
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        # 仓库提交的是 pnpm-lock.yaml，用 --frozen-lockfile 保证 CI 与本地一致
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        # 单元测试放在构建之前：测试挂了就不必浪费一次部署
        run: pnpm test

      # ── 静态守卫（不需要浏览器，几秒钟）──
      # 这两项查的都是**静默失效**：编译通过、测试通过、只有玩家看得出来。
      # 放在这里而不是靠人肉发现，是因为它们抓到的每一类缺陷
      # （关键词指向不存在的部件、源码被写坏成乱码）都曾经真的发生过。
      - name: Check source encoding
        # 源码/文档级乱码与非法 UTF-8。历史上 PowerShell 把 UTF-8 当 GBK
        # 读写，弄坏过文件，而且这类损坏不报错、不影响编译。
        run: pnpm check:encoding

      - name: Check keyword tables against real assets
        # 词表里的部件 id 片段是否真实存在。写错的代价是不报错、
        # 只退化成随机（"铁匠穿工装裤""管家戴野蛮人头盔"）。
        run: pnpm check:keywords

      - name: Check built-in worlds
        # 三个内置世界的**内容契约**：每世界 ≥5 万字、worldLore ≥3 万、
        # startingItems / attributeBonus 等引用是否指向真实 id、题材禁用词、
        # 角色卡是否写清性别线索（否则立绘随机长脸），
        # 以及沙盒要求：地图 / 势力范围 / 生活气息各 ≥3000 字、
        # 长期目标有没有被写成任务书、rules 里有没有明确的沙盒条款。
        # 这一项拦的是"内容悄悄退化"——编译器和单元测试都看不见那类问题。
        run: pnpm check:worlds

      # 立绘一致性：look 里的部件 id / 颜色键写错会**静默失效**（不报错、画错人），
      # 所以必须单独对一遍素材目录。见 scripts/check-sprites.mjs 的说明。
      - run: pnpm check:look

      - name: Self-test the guards
        # 用**污染测试**证明上面两个守卫真的会报警 ——
        # 一个只会打印"全部通过"的检测器毫无价值。
        run: pnpm check:tools

      - name: Build
        run: pnpm build

      # ── 浏览器走查 ──
      # 放在 build 之后、上传产物之前：走查挂了就不部署，
      # 免得把"能构建但交互坏了"的版本发到线上。
      #
      # 分两步跑，各自验证不同的东西：
      #   1. preview（真实 dist 产物）→ 确认构建产物本身能跑、门面正常
      #   2. dev server → 跑全套走查
      #
      # 为什么全套必须在 dev 上跑：走查需要 `__gameStore` 之类的调试钩子
      # 来准备游戏状态（直接塞角色、物品、时间），而这些钩子在生产构建里
      # 被 `import.meta.env.DEV` 守卫剔除了 —— 这是有意的（不该把内部状态
      # 暴露给线上玩家）。第一版我把走查直接指向 preview，结果 3/4 套全挂，
      # 报 `__gameStore is not defined`。
      - name: Walkthroughs on production build (smoke)
        run: |
          # 记下我们启动的 PID，只杀它 ——
          # 用 `Get-Process node | Kill` 会连带把 runner 自己的 node 杀掉。
          $preview = Start-Process -FilePath "node" `
            -ArgumentList "node_modules/vite/bin/vite.js","preview","--port","5199","--strictPort" `
            -NoNewWindow -PassThru
          Start-Sleep -Seconds 6
          node scripts/checks/all.mjs main-menu
          $code = $LASTEXITCODE
          try { Stop-Process -Id $preview.Id -Force } catch {}
          Start-Sleep -Seconds 2
          exit $code
        env:
          SITE: http://localhost:5199/
        shell: pwsh

      - name: Walkthroughs on dev server (full)
        run: |
          Start-Process -FilePath "node" -ArgumentList "node_modules/vite/bin/vite.js","--port","5199","--strictPort" -NoNewWindow
          Start-Sleep -Seconds 12
          node scripts/checks/all.mjs
        env:
          SITE: http://localhost:5199/
        shell: pwsh

      - name: Upload walkthrough screenshots
        # 只在失败时上传，方便排查（成功时不占存储）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: walkthrough-screenshots
          path: playtest-shots/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Vite 默认构建输出目录为 dist
          path: ./dist

  # 部署任务
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # 部署用回 ubuntu：跑得快，且这一步不需要浏览器
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
